<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini AI Chat — Single HTML App</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --panel-bg: #1e293b;
      --card-bg: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --user-bubble: #0284c7;
      --bot-bubble: #1e293b;
      --border-color: #334155;
      --error-color: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .chat-container {
      width: 100%;
      max-width: 800px;
      height: 90vh;
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }

    /* Header & Key Setup */
    .chat-header {
      padding: 16px 20px;
      background: #182234;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-title {
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--primary);
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 12px;
      color: var(--primary);
    }

    .key-bar {
      display: flex;
      gap: 8px;
    }

    .key-bar input {
      flex: 1;
      padding: 8px 12px;
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .key-bar input:focus {
      border-color: var(--primary);
    }

    .btn-key {
      padding: 8px 14px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-key:hover {
      background: var(--border-color);
    }

    /* Messages Stream */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .message-row {
      display: flex;
      gap: 12px;
      max-width: 85%;
    }

    .message-row.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message-row.model {
      align-self: flex-start;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: bold;
      flex-shrink: 0;
    }

    .avatar.user-avatar {
      background: #0284c7;
      color: white;
    }

    .avatar.model-avatar {
      background: #38bdf8;
      color: #0f172a;
    }

    .bubble {
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 0.95rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message-row.user .bubble {
      background: var(--user-bubble);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .message-row.model .bubble {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 4px;
    }

    .bubble.error-bubble {
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid var(--error-color);
      color: #fecdd3;
    }

    /* Typing Pulse */
    .typing-dots {
      display: inline-flex;
      gap: 4px;
      align-items: center;
      padding: 4px 8px;
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: pulse 1.2s infinite ease-in-out;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* Input Footer */
    .chat-footer {
      padding: 16px 20px;
      background: #182234;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 10px;
    }

    .chat-input {
      flex: 1;
      padding: 12px 16px;
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      resize: none;
      height: 48px;
      max-height: 120px;
      line-height: 1.4;
    }

    .chat-input:focus {
      border-color: var(--primary);
    }

    .btn-send {
      padding: 0 20px;
      height: 48px;
      background: var(--primary);
      color: #0f172a;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .btn-send:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn-send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <!-- Header -->
    <header class="chat-header">
      <div class="header-top">
        <div class="header-title">
          <span>✨ Gemini AI Assistant</span>
          <span class="status-badge" id="model-badge">gemini-2.5-flash</span>
        </div>
        <button class="btn-key" id="clear-chat-btn" title="Clear chat history">Clear Chat</button>
      </div>

      <!-- API Key Row -->
      <div class="key-bar">
        <input 
          type="password" 
          id="api-key-input" 
          placeholder="Paste Google AI Studio API Key (AIzaSy...)" 
          autocomplete="off"
        />
        <button class="btn-key" id="save-key-btn">Save Key</button>
      </div>
    </header>

    <!-- Message Area -->
    <main class="chat-messages" id="messages-container">
      <div class="message-row model">
        <div class="avatar model-avatar">AI</div>
        <div class="bubble">
          Hello! I am connected directly via Google AI Studio's Gemini API.<br /><br />
          To start chatting:
          1. Paste your Gemini API key in the top bar and click <b>Save Key</b>.
          2. Type your message below and press Enter or Send!
        </div>
      </div>
    </main>

    <!-- Footer Input -->
    <footer class="chat-footer">
      <textarea 
        id="user-input" 
        class="chat-input" 
        placeholder="Type your message here... (Shift + Enter for new line)"
        rows="1"
      ></textarea>
      <button id="send-btn" class="btn-send">Send</button>
    </footer>
  </div>

  <script>
    // State management
    let conversationHistory = [];
    const API_STORAGE_KEY = "gemini_standalone_api_key";
    const MODEL_NAME = "gemini-2.5-flash";

    // DOM Elements
    const apiKeyInput = document.getElementById("api-key-input");
    const saveKeyBtn = document.getElementById("save-key-btn");
    const clearChatBtn = document.getElementById("clear-chat-btn");
    const messagesContainer = document.getElementById("messages-container");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");

    // Load saved API Key from localStorage
    const savedKey = localStorage.getItem(API_STORAGE_KEY);
    if (savedKey) {
      apiKeyInput.value = savedKey;
      saveKeyBtn.textContent = "Saved ✓";
      saveKeyBtn.style.color = "#38bdf8";
    }

    // Save key event
    saveKeyBtn.addEventListener("click", () => {
      const key = apiKeyInput.value.trim();
      if (!key) {
        alert("Please enter a valid Gemini API Key.");
        return;
      }
      localStorage.setItem(API_STORAGE_KEY, key);
      saveKeyBtn.textContent = "Saved ✓";
      saveKeyBtn.style.color = "#38bdf8";
      setTimeout(() => {
        saveKeyBtn.textContent = "Save Key";
        saveKeyBtn.style.color = "";
      }, 2000);
    });

    // Clear chat event
    clearChatBtn.addEventListener("click", () => {
      conversationHistory = [];
      messagesContainer.innerHTML = `
        <div class="message-row model">
          <div class="avatar model-avatar">AI</div>
          <div class="bubble">Chat history cleared. What would you like to explore next?</div>
        </div>
      `;
    });

    // Auto-expand textarea
    userInput.addEventListener("input", () => {
      userInput.style.height = "auto";
      userInput.style.height = Math.min(userInput.scrollHeight, 120) + "px";
    });

    // Enter to send (Shift + Enter for new line)
    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    sendBtn.addEventListener("click", sendMessage);

    // Scroll to bottom helper
    function scrollToBottom() {
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // Append Message to UI
    function appendMessage(role, text, isError = false) {
      const row = document.createElement("div");
      row.className = `message-row ${role}`;

      const avatar = document.createElement("div");
      avatar.className = `avatar ${role === "user" ? "user-avatar" : "model-avatar"}`;
      avatar.textContent = role === "user" ? "You" : "AI";

      const bubble = document.createElement("div");
      bubble.className = `bubble ${isError ? "error-bubble" : ""}`;
      bubble.textContent = text;

      row.appendChild(avatar);
      row.appendChild(bubble);
      messagesContainer.appendChild(row);
      scrollToBottom();
      return bubble;
    }

    // Append Loading Indicator
    function appendTypingIndicator() {
      const row = document.createElement("div");
      row.className = "message-row model";
      row.id = "typing-indicator-row";

      const avatar = document.createElement("div");
      avatar.className = "avatar model-avatar";
      avatar.textContent = "AI";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = `
        <div class="typing-dots">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      `;

      row.appendChild(avatar);
      row.appendChild(bubble);
      messagesContainer.appendChild(row);
      scrollToBottom();
    }

    function removeTypingIndicator() {
      const indicator = document.getElementById("typing-indicator-row");
      if (indicator) indicator.remove();
    }

    // Core Send Message Function
    async function sendMessage() {
      const text = userInput.value.trim();
      const apiKey = apiKeyInput.value.trim();

      if (!text) return;

      if (!apiKey) {
        alert("Please enter and save your Google AI Studio API key at the top before sending messages.");
        apiKeyInput.focus();
        return;
      }

      // Add user message to UI
      appendMessage("user", text);
      userInput.value = "";
      userInput.style.height = "48px";
      userInput.disabled = true;
      sendBtn.disabled = true;

      // Add to conversation history
      conversationHistory.push({
        role: "user",
        parts: [{ text: text }]
      });

      appendTypingIndicator();

      try {
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`;

        const response = await fetch(endpoint, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            contents: conversationHistory
          })
        });

        removeTypingIndicator();

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          const errMsg = errData.error?.message || `HTTP ${response.status} ${response.statusText}`;
          throw new Error(errMsg);
        }

        const data = await response.json();
        const modelReply = data.candidates?.[0]?.content?.parts?.[0]?.text || "No response received.";

        // Append to conversation history & UI
        conversationHistory.push({
          role: "model",
          parts: [{ text: modelReply }]
        });

        appendMessage("model", modelReply);

      } catch (err) {
        removeTypingIndicator();
        console.error("Gemini API Error:", err);
        appendMessage("model", `⚠️ Error: ${err.message}`, true);
        // Roll back the last user message from history on failure
        conversationHistory.pop();
      } finally {
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
      }
    }
  </script>
</body>
</html>
