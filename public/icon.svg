<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#05070c" />
      <stop offset="100%" stop-color="#020306" />
    </linearGradient>

    <!-- Glowing Cyan/Purple Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="centerAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base App Icon Rounded Squircle (Standard iOS/Android/PWA 110px corner radius) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="115" fill="url(#centerAura)" />
  <rect x="2" y="2" width="508" height="508" rx="113" fill="none" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Cyber Grid Subtle Detail Lines -->
  <path d="M60 256 H452" stroke="#06b6d4" stroke-opacity="0.07" stroke-width="2" stroke-dasharray="8 8" />
  <path d="M256 60 V452" stroke="#06b6d4" stroke-opacity="0.07" stroke-width="2" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="180" stroke="#a855f7" stroke-opacity="0.05" stroke-width="2" />

  <!-- Back Chat Bubble (Purple Accent - Peer) -->
  <g filter="url(#softGlow)" opacity="0.95">
    <path d="M200 140 H350 C377.6 140 400 162.4 400 190 V270 C400 297.6 377.6 320 350 320 H320 L300 360 L270 320 H200 C172.4 320 150 297.6 150 270 V190 C150 162.4 172.4 140 200 140 Z" 
          fill="#130e24" 
          stroke="url(#neonPurple)" 
          stroke-width="5" />
    <!-- Peer Chat Pulse Dots -->
    <circle cx="235" cy="225" r="7" fill="#c084fc" />
    <circle cx="275" cy="225" r="7" fill="#c084fc" />
    <circle cx="315" cy="225" r="7" fill="#c084fc" />
  </g>

  <!-- Front Chat Bubble (Cyan Monolith Primary - User) -->
  <g filter="url(#cyanGlow)">
    <path d="M162 192 H312 C339.6 192 362 214.4 362 242 V322 C362 349.6 339.6 372 312 372 H242 L212 412 L192 372 H162 C134.4 372 112 349.6 112 322 V242 C112 214.4 134.4 192 162 192 Z" 
          fill="#061a24" 
          stroke="url(#neonCyan)" 
          stroke-width="7" />
    
    <!-- Central Glowing Signal Lightning / Monolith Waveform -->
    <path d="M170 282 L205 282 L225 242 L250 322 L270 282 L304 282" 
          fill="none" 
          stroke="#22d3ee" 
          stroke-width="6" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Matrix Connection Nodes & Sparkles -->
  <circle cx="362" cy="192" r="6" fill="#22d3ee" filter="url(#softGlow)" />
  <circle cx="112" cy="322" r="5" fill="#22d3ee" filter="url(#softGlow)" />
  <circle cx="400" cy="190" r="5" fill="#e879f9" filter="url(#softGlow)" />

  <polygon points="256,72 262,88 278,94 262,100 256,116 250,100 234,94 250,88" fill="#22d3ee" opacity="0.8" />
  <polygon points="420,130 424,140 434,144 424,148 420,158 416,148 406,144 416,140" fill="#c084fc" opacity="0.7" />
</svg>
